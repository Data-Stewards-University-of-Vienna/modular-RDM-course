name: Build combined LiaScript course

on:
  # Rebuild immediately when course source files or the generator change.
  push:
    branches:
      - main
    paths:
      - "modules/core/**"
      - "modules/satellite/**"
      - "scripts/combine_files.py"
      - ".github/workflows/build-combined-course.yml"

  # Also rebuild once per day as a fallback.
  # GitHub Actions cron times are in UTC.
  schedule:
    - cron: "0 3 * * *"

  # Enables manually running this workflow from GitHub's Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-course:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Combine course modules
        run: |
          python scripts/combine_files.py

      - name: Commit updated combined course if necessary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add modules/combined.md

          if git diff --cached --quiet; then
            echo "modules/combined.md is already up to date."
          else
            git commit -m "chore: update combined LiaScript course"
            git push
          fi
